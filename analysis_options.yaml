include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Pacote de benchmark (e os satélites dele: apps do size, runner do
    # epubx): cada um tem a sua análise, com o próprio `pub get`, em passos
    # próprios do CI. Sem o `pub get` deles, a análise da raiz não resolve
    # os imports.
    - benchmark/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - public_member_api_docs
    - always_declare_return_types

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Apps do modo size do benchmark: cada um tem a sua análise (CI própria).
    - benchmark/size/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - public_member_api_docs
    - always_declare_return_types

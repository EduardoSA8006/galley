# Envio dos resultados do bench-pr ao Bencher (só histórico e comentário no
# PR).
#
# Roda no contexto da `main` (workflow_run), com acesso ao secret
# BENCHER_API_KEY, e por isso NUNCA faz checkout nem executa código do PR:
# só baixa o BMF (JSON, lido pela CLI do Bencher como dado). O PR alvo do
# comentário e o branch do Bencher (`pr-<número>`) vêm só do evento e da API
# do GitHub (PR aberto cujo head é o commit medido), nunca do artefato. Sem
# PR verificado ou sem a chave, o envio é pulado com aviso.
#
# O BMF é produzido por código do PR (num fork, até o bench-pr.yml é o do
# fork): antes de a chave entrar em qualquer passo, ele é validado com jq
# (ids e medidas conhecidos, valores numéricos finitos, tamanho limitado).
# Se não passar, o envio é pulado com aviso.
#
# Os testbeds são os mesmos do noturno por tipo de medida
# (`github-ubuntu-valgrind` e `github-ubuntu-ab`), para que o
# `--start-point main` traga o histórico da `main` ao PR.
#
# Atenção: o GitHub só dispara workflow_run a partir da cópia deste arquivo
# na branch padrão; ele passa a valer depois do merge.
name: bench-pr-upload

on:
  workflow_run:
    workflows: [bench-pr]
    types: [completed]

permissions: {}

jobs:
  upload:
    name: upload (${{ matrix.kind }})
    # Gate reprovado também é histórico; cancelado ou pulado não tem dados.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # baixar artefatos de outra execução
      contents: read # API commits/{sha}/pulls (sem checkout)
      checks: write # check do Bencher
      pull-requests: write # comentário do Bencher no PR
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: instructions
            testbed: github-ubuntu-valgrind
          - kind: ab
            testbed: github-ubuntu-ab
    steps:
      - name: Verificar a chave do Bencher
        id: key
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          if [ -z "$BENCHER_API_KEY" ]; then
            echo "::notice::Envio ao Bencher pulado: o secret BENCHER_API_KEY não está definido."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.key.outputs.present == 'true'
        # Sem artefato (agregador não chegou a gravar), o passo seguinte
        # pula o envio com aviso em vez de deixar o workflow vermelho.
        continue-on-error: true
        with:
          name: bench-${{ matrix.kind }}
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Identificar o PR (dados confiáveis)
        id: inputs
        if: steps.key.outputs.present == 'true'
        env:
          # Tudo do payload do evento ou da API do GitHub; nada do artefato.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          KIND: ${{ matrix.kind }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head_sha inválido"
            exit 1
          fi
          # PR aberto deste repositório cujo head é exatamente o commit medido.
          filter='[.[] | select(.state == "open" and .head.sha == env.HEAD_SHA and .base.repo.full_name == env.REPO) | .number] | first // empty'
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq "$filter" || true)
          if [ -z "$pr" ]; then
            # PRs de fork nem sempre aparecem pelo commit: procura pelo head
            # owner:branch e confere o sha do mesmo jeito.
            pr=$(gh api -X GET "repos/$REPO/pulls" -f state=open \
              -f head="$HEAD_OWNER:$HEAD_BRANCH" --jq "$filter" || true)
          fi
          if ! [[ "$pr" =~ ^[0-9]{1,10}$ ]]; then
            echo "::notice::Nenhum PR aberto com head $HEAD_SHA: envio ao Bencher pulado."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [ -s artifact/bmf.json ]; then
            echo "::notice::Sem bmf.json no artefato bench-$KIND: nada a enviar."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Validação do BMF (não confiável): sem a chave no ambiente.
          size=$(stat -c %s artifact/bmf.json)
          if [ "$size" -gt 524288 ]; then
            echo "::notice::bmf.json com $size bytes (máximo 512 KiB): envio ao Bencher pulado."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Ids como os do catálogo, medidas conhecidas, só value/lower/upper
          # e números finitos; no máximo 2000 benchmarks.
          validate='type == "object" and length >= 1 and length <= 2000
            and all(to_entries[];
              (.key | test("^[a-z0-9][a-z0-9/._-]{0,127}$"))
              and (.value | type == "object" and length >= 1 and length <= 6
                and all(to_entries[];
                  (.key | IN("instructions", "wall-time-ns", "peak-rss-bytes",
                    "bytes-read", "size-bytes", "count"))
                  and (.value | type == "object" and has("value")
                    and all(to_entries[];
                      (.key | IN("value", "lower_value", "upper_value"))
                      and (.value | type == "number"
                        and (isinfinite | not) and (isnan | not)))))))'
          if ! jq -e "$validate" artifact/bmf.json > /dev/null 2>&1; then
            echo "::notice::bmf.json fora do formato esperado (ids, medidas ou valores): envio ao Bencher pulado."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Branch do Bencher derivado só do número verificado: único e sem
          # colisão com branches reais (nunca o head_branch cru).
          {
            echo "upload=true"
            echo "pr=$pr"
            echo "branch=pr-$pr"
            echo "sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
      - uses: bencherdev/bencher@b2484bc6734c8e6da4fad141bd13527a11da3988 # v0.6.17
        if: steps.inputs.outputs.upload == 'true'
      - name: Enviar ao Bencher
        if: steps.inputs.outputs.upload == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TESTBED: ${{ matrix.testbed }}
          KIND: ${{ matrix.kind }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr }}
          BRANCH: ${{ steps.inputs.outputs.branch }}
          SHA: ${{ steps.inputs.outputs.sha }}
        run: |
          bencher run \
            --project galley \
            --testbed "$TESTBED" \
            --branch "$BRANCH" \
            --hash "$SHA" \
            --start-point main \
            --start-point-reset \
            --adapter json \
            --file artifact/bmf.json \
            --github-actions "$GITHUB_TOKEN" \
            --ci-number "$PR_NUMBER" \
            --ci-id "bench-$KIND"

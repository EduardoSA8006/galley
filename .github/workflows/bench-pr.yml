# Gates de desempenho do PR (instruções e A/B), sem secrets.
#
# Os dois gates são repartidos em fatias paralelas (`--shard i/n`) para caber
# em ~15 min de parede; os jobs finais `instructions` e `ab` juntam as fatias
# e são os checks obrigatórios da `main` (`bench-pr / instructions` e
# `bench-pr / ab`). O envio ao Bencher fica no `bench-pr-upload.yml`
# (workflow_run), que nunca executa código do PR.
#
# Regressão ou checksum divergente intencional: o rótulo
# `perf-regression-accepted` (só quem tem acesso de escrita aplica) faz os
# agregadores aprovarem com aviso, listando o que foi aceito no resumo. O
# rótulo vem do evento `pull_request` (via env), nunca do código do PR.
# Aplicar ou tirar o rótulo roda o workflow de novo.
name: bench-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: bench-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Os jobs de benchmark usam Flutter/Dart fixos (Dart 3.13.4).
  FLUTTER_VERSION: '3.47.5'
  # Rodadas do A/B no PR: cabe no orçamento de ~15 min com 2 fatias.
  AB_ROUNDS: '15'

jobs:
  instructions-shard:
    name: instructions-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Só o número de entradas importa: índice e total da fatia vêm de
        # strategy.job-index/job-total, e o agregador confere a cobertura.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Head do PR (não o merge commit) e histórico completo para o
          # merge-base com a base.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Instalar o Valgrind
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends valgrind
      - name: Dependências do benchmark
        working-directory: benchmark
        run: dart pub get
      - name: Gate de instruções (fatia ${{ matrix.shard }})
        working-directory: benchmark
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          echo "Base (merge-base): $base"
          mkdir -p "$RUNNER_TEMP/out"
          shard="$((SHARD_INDEX + 1))/$SHARD_TOTAL"
          echo "$shard" > "$RUNNER_TEMP/out/shard"
          set +e
          dart run tool/bench.dart instructions \
            --base "$base" --head HEAD --counter valgrind \
            --shard "$shard" \
            --out "$RUNNER_TEMP/out/bmf.json" \
            --report "$RUNNER_TEMP/out/report.md"
          code=$?
          echo "$code" > "$RUNNER_TEMP/out/exit-code"
          exit "$code"
      - name: Resumo
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/out/report.md" ]; then
            cat "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-instructions-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
          retention-days: 7

  instructions:
    needs: instructions-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Só o script do agregador (sem secrets: é um job de pull_request).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-instructions-shard-*
          path: shards
        # Sem nenhuma fatia com artefato, o veredito abaixo ainda decide.
        continue-on-error: true
      - name: Juntar as fatias e decidir
        env:
          # Rótulo lido do evento (metadado do PR), nunca do código.
          ACCEPT_REGRESSION: ${{ contains(github.event.pull_request.labels.*.name, 'perf-regression-accepted') }}
          NEEDS_RESULT: ${{ needs.instructions-shard.result }}
        run: bash .github/scripts/bench-aggregate.sh shards out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Gate reprovado também vira histórico no Bencher.
        if: always()
        with:
          name: bench-instructions
          path: out/
          if-no-files-found: warn
          retention-days: 7

  ab-shard:
    name: ab-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Só o número de entradas importa: índice e total da fatia vêm de
        # strategy.job-index/job-total, e o agregador confere a cobertura.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependências do benchmark
        working-directory: benchmark
        run: dart pub get
      - name: A/B de tempo de parede (fatia ${{ matrix.shard }})
        working-directory: benchmark
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          echo "Base (merge-base): $base"
          mkdir -p "$RUNNER_TEMP/out"
          shard="$((SHARD_INDEX + 1))/$SHARD_TOTAL"
          echo "$shard" > "$RUNNER_TEMP/out/shard"
          set +e
          dart run tool/bench.dart ab \
            --base "$base" --head HEAD --rounds "$AB_ROUNDS" \
            --shard "$shard" \
            --out "$RUNNER_TEMP/out/bmf.json" \
            --report "$RUNNER_TEMP/out/report.md"
          code=$?
          echo "$code" > "$RUNNER_TEMP/out/exit-code"
          exit "$code"
      - name: Resumo
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/out/report.md" ]; then
            cat "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-ab-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
          retention-days: 7

  ab:
    needs: ab-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Só o script do agregador (sem secrets: é um job de pull_request).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-ab-shard-*
          path: shards
        # Sem nenhuma fatia com artefato, o veredito abaixo ainda decide.
        continue-on-error: true
      - name: Juntar as fatias e decidir
        env:
          # Rótulo lido do evento (metadado do PR), nunca do código.
          ACCEPT_REGRESSION: ${{ contains(github.event.pull_request.labels.*.name, 'perf-regression-accepted') }}
          NEEDS_RESULT: ${{ needs.ab-shard.result }}
        run: bash .github/scripts/bench-aggregate.sh shards out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Gate reprovado também vira histórico no Bencher.
        if: always()
        with:
          name: bench-ab
          path: out/
          if-no-files-found: warn
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    name: analyze-test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Versão mínima suportada (pubspec: flutter >=3.47.0).
          - name: '3.47.5'
            flutter-version: '3.47.5'
          # Última estável: sem flutter-version, a action instala a mais recente do canal.
          - name: stable
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --exclude-tags heavy
      - name: Analisar o app de exemplo
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
      - name: Analisar e testar o pacote de benchmark
        working-directory: benchmark
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test -x slow
      # O epubx (image ^3) não resolve junto com o epub_plus/epub_pro (image
      # ^4): tem pacote e executável próprios para o modo compare.
      - name: Analisar e testar o runner do epubx
        working-directory: benchmark/competitors/epubx_runner
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

  # Testes pesados (livro sintético de 300 MiB), isolados dos jobs comuns.
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags heavy

  integration:
    name: integration (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get

      - name: Dependências do Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      # Um arquivo por vez (no Linux subir o app uma segunda vez na mesma
      # sessão falha) e acumulando falhas em vez de abortar na primeira.
      - name: Testes de integração (linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          rc=0
          for f in integration_test/*_test.dart; do
            timeout -k 10 900 xvfb-run -a flutter test "$f" -d linux \
              || { echo "::error::$f falhou ou excedeu 900s"; rc=1; }
          done
          exit $rc

      - name: Testes de integração (macos)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # macOS não tem `timeout` do GNU coreutils; perl com alarm faz o mesmo.
          rc=0
          for f in integration_test/*_test.dart; do
            perl -e 'alarm shift; exec @ARGV' 900 flutter test "$f" -d macos \
              || { echo "::error::$f falhou ou excedeu 900s"; rc=1; }
          done
          exit $rc

      - name: Testes de integração (windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          # Git Bash do runner Windows traz o `timeout` do coreutils.
          rc=0
          for f in integration_test/*_test.dart; do
            timeout -k 10 900 flutter test "$f" -d windows \
              || { echo "::error::$f falhou ou excedeu 900s"; rc=1; }
          done
          exit $rc

      - name: Habilitar KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testes de integração (android)
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: example
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash -c 'rc=0; for f in integration_test/*_test.dart; do timeout -k 10 900 flutter test "$f" || { echo "::error::$f falhou ou excedeu 900s"; rc=1; }; done; exit $rc'

      - name: Testes de integração (ios)
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          for key in sorted((k for k in devs if 'iOS' in k), key=lambda k: [int(x) for x in k.rsplit('iOS-', 1)[1].split('-')], reverse=True):
              for d in devs[key]:
                  if 'iPhone' in d['name']:
                      print(d['udid']); sys.exit(0)
          sys.exit(1)
          ")
          # O boot do simulador falha de forma intermitente (bootstatus termina
          # com Status=4294967295). Tenta até 3 vezes, limpando o aparelho entre
          # as tentativas; sem boot, o passo falha em vez de deixar o teste pendurado.
          booted=0
          for attempt in 1 2 3; do
            echo "Boot do simulador, tentativa $attempt"
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            if [ "$attempt" -gt 1 ]; then xcrun simctl erase "$UDID"; fi
            xcrun simctl boot "$UDID" || true
            if perl -e 'alarm shift; exec @ARGV' 300 xcrun simctl bootstatus "$UDID" -b; then
              booted=1
              break
            fi
          done
          if [ "$booted" -ne 1 ]; then
            echo "::error::simulador não iniciou após 3 tentativas"
            exit 1
          fi
          rc=0
          for f in integration_test/*_test.dart; do
            perl -e 'alarm shift; exec @ARGV' 900 flutter test "$f" -d "$UDID" \
              || { echo "::error::$f falhou ou excedeu 900s"; rc=1; }
          done
          exit $rc

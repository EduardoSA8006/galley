<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="en" xml:lang="en">
<head>
<meta charset="utf-8"/>
<title>Tables</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<h1>Tables</h1>
<table><caption>Harvest by orchard</caption>
<thead><tr><th>Orchard</th><th>Apples (kg)</th><th>Pears (kg)</th></tr></thead>
<tbody>
<tr><td>North</td><td class="num">1200</td><td class="num">340</td></tr>
<tr><td>South</td><td class="num">980</td><td class="num">415</td></tr>
<tr><td>East</td><td class="num">1105</td><td class="num">0</td></tr>
</tbody>
<tfoot><tr><th>Total</th><td class="num">3285</td><td class="num">755</td></tr></tfoot></table>
<table><caption>Merged cells</caption>
<tr><th colspan="3">Week</th></tr>
<tr><td rowspan="2">Mon</td><td>am</td><td>rain</td></tr>
<tr><td>pm</td><td>sun</td></tr>
<tr><td colspan="2">Tue</td><td>wind</td></tr></table>
<p>Text after the tables, to check flow resumes correctly.</p>
</body>
</html>

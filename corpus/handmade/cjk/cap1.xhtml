<h1>朝の散歩</h1>
<p>朝早く、静かな川沿いの道を歩いた。空はまだ薄い青色で、遠くの山が霞んで見える。</p>
<p>「おはようございます」と、犬を連れた老人が<ruby>微笑<rt>ほほえ</rt></ruby>んだ。私も軽く頭を下げた。</p>
<p>橋の上で立ち止まり、水の流れをしばらく眺めた。English words like Galley and EPUB mix in 日本語の文章.</p>

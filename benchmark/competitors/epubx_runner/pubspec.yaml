name: epubx_runner
description: >-
  Executável de medição do epubx para o modo compare do benchmark. Fica num
  pacote próprio porque o epubx exige image ^3, incompatível com o image ^4 do
  epub_plus e do epub_pro (usados em benchmark/).
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  epubx: ^4.0.0

dev_dependencies:
  archive: ^3.6.1
  flutter_lints: ^6.0.0
  test: ^1.25.0

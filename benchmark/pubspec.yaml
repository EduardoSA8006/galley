  crypto: ^3.0.6
  epub_plus: ^5.1.0
  epub_pro: ^5.6.0
  galley:
    path: ..
  xml: ^6.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.0
